name: first_project
description: "A new Flutter project."
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  get: ^4.7.3
  flutter_svg: ^2.3.0
  dio: ^5.10.0
  json_annotation: ^4.12.0
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1
  path: ^1.9.1
  path_provider: ^2.1.6
  toastification: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.0
  objectbox_generator: ^5.3.2
  # 2.15.2 requires analyzer >=13.3, while ObjectBox Generator 5.3.2 requires
  # analyzer <11. Keep this exact until ObjectBox widens its analyzer range.
  build_runner: 2.15.1


flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/images/android.png
    - assets/images/back.svg

objectbox:
  output_dir: database
